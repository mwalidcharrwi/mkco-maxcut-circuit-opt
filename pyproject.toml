[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkco"
version = "0.1.0"
description = "Quantum circuit optimization by precedence-constrained Max-k-Cut (extends Lee, Jeong & Kim, Quantum 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Walid Charrwi" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "networkx>=3.0"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
exact = ["ortools>=9.8"]
sdp = ["cvxpy>=1.4"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=7", "qiskit>=1.0", "ortools>=9.8", "matplotlib>=3.8", "cvxpy>=1.4"]

[project.scripts]
mkco = "mkco.__main__:main"

[tool.setuptools]
packages = ["mkco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
